[package]
name = "webmon"
version = "0.1.0"
edition = "2021"
description = "Poll web pages on a schedule, diff them against the last snapshot, and push a plain-text diff to ntfy.sh when they change."

[[bin]]
name = "webmon"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "=1.0.203", features = ["derive"] }
toml = "=0.8.14"
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "=1.10.5"
similar = "=2.5.0"
chrono = "=0.4.38"
fern = "=0.6.2"
log = "=0.4.22"
anyhow = "=1.0.86"

# Pinned transitive deps whose newer releases bumped edition/MSRV past what
# this build environment's rustc (1.75) supports.
url = "=2.5.0"
indexmap = "=2.2.6"
encoding_rs = "=0.8.34"

[profile.release]
opt-level = 2
